[package]
name = "neenee-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "neenee"
path = "src/main.rs"

[dependencies]
neenee-agent = { path = "../neenee-agent" }
neenee-contracts = { path = "../neenee-contracts" }
neenee-persistence = { path = "../neenee-persistence" }
neenee-runtime = { path = "../neenee-runtime" }
neenee-skills = { path = "../neenee-skills" }
neenee-providers = { path = "../neenee-providers" }
neenee-mcp = { path = "../neenee-mcp" }
neenee-tui = { path = "../neenee-tui" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
