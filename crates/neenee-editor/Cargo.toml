[package]
name = "neenee-editor"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "neenee-editor"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# `gui` pulls in the optics stack (iris owns the window/event loop; flux +
# flux-text + flux-text-layout paint the document surface). Without it the
# crate is a pure-Rust headless text engine (buffer/selection/history/editor)
# that builds and tests without a GPU or a compositor.
gui = [
    "dep:iris",
    "dep:flux",
    "dep:flux-text",
    "dep:flux-text-layout",
]

[dependencies]
# Optics. `iris` is pinned to the same rev neenee-quant-gui uses (it pulls
# lens + flux transitively). The flux siblings come in explicitly because we
# paint the document surface directly rather than through lens widgets.
# These resolve to the local ../optics checkout via .cargo/config.toml's path
# override; on CI they come from the pinned git rev / registry.
iris = { git = "https://github.com/ming2k/optics.git", rev = "0c9d4a2aa083f015addd7f012720015fc3f98de4", optional = true }
flux = { git = "https://github.com/ming2k/optics.git", rev = "0c9d4a2aa083f015addd7f012720015fc3f98de4", optional = true }
flux-text = { git = "https://github.com/ming2k/optics.git", rev = "0c9d4a2aa083f015addd7f012720015fc3f98de4", optional = true }
flux-text-layout = { git = "https://github.com/ming2k/optics.git", rev = "0c9d4a2aa083f015addd7f012720015fc3f98de4", optional = true }

unicode-segmentation = "1.12"

[build-dependencies]
# Re-discovers the optics link dirs to bake an rpath into the binary (see
# build.rs). The -sys crates already pull pkg-config as a build-dep, so this
# adds no new network fetch.
pkg-config = "0.3"

[lints]
workspace = true
