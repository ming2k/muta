[package]
name = "neenee-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
neenee-contracts = { path = "../neenee-contracts" }
neenee-llm-client = { path = "../neenee-llm-client" }
neenee-persistence = { path = "../neenee-persistence" }
neenee-providers = { path = "../neenee-providers" }
neenee-skills = { path = "../neenee-skills" }
neenee-tool-derive = { path = "../neenee-tool-derive" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
libc = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
regex = "1"
fastrand = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockito = { workspace = true }
tempfile = { workspace = true }
# `test-path-override` exposes `paths::set_test_default` so catalog discovery
# tests can sandbox the XDG roots; without it a `DiscoveryCache::save()` in a
# test writes `test-instance` rows into the developer's real
# `$XDG_CACHE_HOME/neenee/models_discovery.json`.
neenee-persistence = { path = "../neenee-persistence", features = ["test-path-override"] }

[lints]
workspace = true
