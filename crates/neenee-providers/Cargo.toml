[package]
name = "neenee-providers"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
neenee-core = { path = "../neenee-core" }
neenee-ai-sdk-core = { path = "../neenee-ai-sdk-core" }
neenee-ai-sdk-openai = { path = "../neenee-ai-sdk-openai" }
neenee-ai-sdk-anthropic = { path = "../neenee-ai-sdk-anthropic" }
neenee-ai-sdk-google = { path = "../neenee-ai-sdk-google" }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# `wire` integration test exercises the full HTTP → SSE → parse path against a
# localhost mock server, covering behaviour the in-module unit tests (which can
# only call pure parser functions) cannot reach.
mockito = "1"
tokio = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
