[package]
name = "neenee-quant-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "neenee-quant-gui"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:iris"]

[dependencies]
neenee-core = { path = "../neenee-core" }
neenee-quant = { path = "../neenee-quant" }
iris = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
