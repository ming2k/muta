[package]
name = "neenee-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
neenee-contracts = { path = "../neenee-contracts" }
neenee-platform = { path = "../neenee-platform" }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
directories = "6.0"
libc = { workspace = true }
crc32c = "0.6"
hex = "0.4"
chrono = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Self dev-dependency that enables the sandbox hook for this crate's own
# integration tests (`tests/` cannot see the lib's `cfg(test)`).
neenee-persistence = { path = ".", features = ["test-path-override"] }

[features]
# Exposes the test-only `paths::set_test_default` override to *other crates'*
# test suites (a crate cannot see another crate's `cfg(test)`). Enabled via a
# dev-dependency feature flag so the hook never exists in production builds.
test-path-override = []

[lints]
workspace = true
