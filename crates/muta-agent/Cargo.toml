[package]
name = "muta-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
muta-contracts = { path = "../muta-contracts" }
muta-llm-client = { path = "../muta-llm-client" }
muta-persistence = { path = "../muta-persistence" }
muta-platform = { path = "../muta-platform" }
muta-providers = { path = "../muta-providers" }
muta-skills = { path = "../muta-skills" }
muta-tool-derive = { path = "../muta-tool-derive" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
regex = "1"
fastrand = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
walkdir = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockito = { workspace = true }
tempfile = { workspace = true }
# `test-path-override` exposes `paths::set_test_default` so catalog discovery
# tests can sandbox the XDG roots; without it a `DiscoveryCache::save()` in a
# test writes `test-instance` rows into the developer's real
# `$XDG_CACHE_HOME/muta/models_discovery.json`.
muta-persistence = { path = "../muta-persistence", features = ["test-path-override"] }

[lints]
workspace = true
