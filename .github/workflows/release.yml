name: Release

# Build and publish release binaries when a version tag is pushed.
# Triggered by `git tag v0.x.y && git push --tags`. CI still gates every
# push to main separately in ci.yml; this workflow only runs on tags.

on:
  push:
    tags:
      - "v*"

# A tag is an immutable release point; two concurrent builds for the same tag
# would race to own the GitHub release. Cancel any superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      # The release binary embeds the web panel (ADR-0105): build the bundle
      # first so `neenee-web-assets`' build script finds apps/web/dist.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Tag matches Cargo and web versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          web_version="$(node -p "require('./apps/web/package.json').version")"
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$web_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        working-directory: apps/web
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the build toolchain (channel = "1.95.0"), and
      # that directory override wins over the action's `stable`. Install the
      # cross target into the pinned toolchain; adding it to `stable` via the
      # action's `targets` input leaves the build toolchain without it (E0463).
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Linux ARM64 needs a cross toolchain for linking; x86_64 builds natively.
      # `musl` builds link statically so the binary is portable across distros.
      - name: Install cross-link toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Install musl toolchain (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin neenee
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dirname="neenee-${version}-${{ matrix.target }}"
          mkdir "$dirname"
          cp target/${{ matrix.target }}/release/neenee "$dirname/"
          cp README.md LICENSE "$dirname/"
          tar -czf "$dirname.tar.gz" "$dirname"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dirname.tar.gz" > "$dirname.tar.gz.sha256"
          else
            shasum -a 256 "$dirname.tar.gz" > "$dirname.tar.gz.sha256"
          fi
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $dirname = "neenee-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dirname | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/neenee.exe" "$dirname/"
          Copy-Item README.md, LICENSE "$dirname/"
          Compress-Archive -Path $dirname -DestinationPath "$dirname.zip"
          $hash = (Get-FileHash "$dirname.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dirname.zip" | Set-Content -NoNewline "$dirname.zip.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            neenee-*.tar.gz
            neenee-*.tar.gz.sha256
            neenee-*.zip
            neenee-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
