name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't burn minutes on
# repeated pushes to a PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the dependency resolution locked to the committed Cargo.lock for
  # reproducible, cache-friendly CI.
  RUSTFLAGS: "-D warnings"

# Least privilege: everything below is read-only by default. Jobs that need
# more (the audit job posts a check run) widen their own scope.
permissions:
  contents: read

jobs:
  # First line of defense: the committed Cargo.lock must resolve against
  # Cargo.toml. A `cargo fetch --locked` fails (exit 101) if Cargo.lock is out
  # of sync with Cargo.toml; a clean run proves the lock is committable as-is.
  # This catches drift in ~20s instead of at the first compile step, and it
  # needs network access to fetch git deps, so it can't use --offline.
  lockfile:
    name: Lockfile resolves (--locked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cargo fetch --locked` fails (exit 101) if Cargo.lock is out of sync
      # with Cargo.toml; a clean run proves the lock is committable as-is.
      - run: cargo fetch --locked

  # The Web app is a pnpm workspace package (apps/web) — no Cargo surface,
  # so it needs its own typecheck/build gate. `--frozen-lockfile` fails when
  # the committed root pnpm-lock.yaml is out of sync with apps/web/package.json,
  # mirroring the cargo `lockfile` job's drift check. pnpm is preinstalled on
  # ubuntu-latest runners (setup-node would shadow it with npm otherwise).
  web:
    name: Web app (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Install from the root lockfile (workspace resolution needs the root).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Wire-protocol bump enforcement (ADR-0134): a wire-surface change
      # without a PROTOCOL_VERSION bump fails unless the PR is labeled
      # `wire-compatible` (the author's assertion that the change is purely
      # additive — a reviewer verifies it). Run before the regeneration
      # below so the committed mirror is what gets judged.
      - name: Wire protocol bump policy
        working-directory: .
        run: bash scripts/check-wire-compat.sh
      # Wire-type drift guard: the web client's protocol types
      # (apps/web/src/lib/generated/wire.gen.ts) are generated from
      # muta-contracts by ts-rs; regenerate them and fail on any diff.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wire.gen.ts is up to date
        working-directory: .
        run: |
          cargo test -p muta-contracts --locked
          if ! git diff --exit-code apps/web/src/lib/generated/; then
            echo "::error::wire.gen.ts is stale — run cargo test -p muta-contracts and commit the result"
            exit 1
          fi
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

  # End-to-end smoke: the only gate that catches handshake/auth/transport
  # regressions — unit tests on either side cannot see a version handshake
  # refusal or a mislabeled subprotocol. The web app is built independently
  # in the `web` job; the daemon does not embed frontend assets.
  e2e:
    name: Daemon protocol smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p muta -p mutx --locked
      - name: Start an isolated daemon and smoke it
        working-directory: .
        env:
          # ADR-0121: one variable isolates the instance root (config, data,
          # state, daemon runtime files); MUTA_PORT takes a port that can
          # never contend with anything else on the runner. The same contract
          # `--home` / `MUTA_HOME` provide locally.
          MUTA_HOME: ${{ runner.temp }}/muta-e2e-home
          MUTA_PORT: "9800"
        run: |
          set -e
          mkdir -p "$MUTA_HOME"
          ./target/debug/muta start --port 9800 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:9800/healthz > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:9800/healthz
          TOKEN=$(./target/debug/muta token)
          DAEMON_TOKEN="$TOKEN" node apps/web/e2e/daemon-smoke.mjs
          ./target/debug/muta stop || true
      # CLI-surface smoke (ADR-0119/0121): the binary's own contract —
      # retired spellings teach, noun-verb shapes parse, --remote connects.
      # Protocol-level coverage lives in daemon-smoke.mjs above; this pins
      # what that cannot see: parsing, exit codes, and the remote path.
      - name: CLI surface smoke
        run: bash apps/web/e2e/cli-smoke.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting is cheap and dependency-free, so cover every member instead
      # of maintaining a second, easily stale workspace list here.
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -D warnings comes from the workflow-level RUSTFLAGS.
      - run: cargo clippy --workspace --all-targets --locked

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests in an isolated home
        # ADR-0121: belt-and-braces. Every suite sandboxes itself, but a
        # process-wide MUTA_HOME means a test that forgets its own sandbox
        # still resolves inside the throwaway root instead of the runner's
        # HOME. The runner context is valid at step scope, not job env scope.
        env:
          MUTA_HOME: ${{ runner.temp }}/muta-test-home
        run: cargo test --workspace --locked --no-fail-fast

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pin to the exact MSRV declared in every crate's Cargo.toml. Bump this
      # in lockstep when raising rust-version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.95
      # `--locked` guarantees the Cargo.lock resolves under this toolchain.
      - run: cargo check --workspace --all-targets --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Treat rustdoc warnings (broken intra-doc links, etc.) as failures so the
    # job can't quietly regress. The one prior broken link (`EXPLORE`) was fixed
    # in `crates/muta-agent/src/task_tool.rs`.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build docs for the whole workspace; catches hard rustdoc failures.
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Coverage is informational; never gate merges on it. Build without
    # `-D warnings` so a stray warning in the coverage build (which uses
    # different rustc flags) can't turn the report red.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Generate an lcov report and print a textual summary to the log.
      # `--exclude` mirrors the workspace-selection policy above so coverage
      # only tracks the crates we actually gate.
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov --workspace --locked --summary-only
      # Persist the report as a workflow artifact so it can be downloaded and
      # viewed locally without wiring up a third-party coverage service.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # audit-check posts a check run, so it needs checks:write in addition to
    # the workflow's read-only default.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # Keep CI tooling independent from the workspace MSRV. audit-check
      # otherwise compiles the latest cargo-audit under rust-toolchain.toml;
      # its transitive dependencies may legitimately require a newer compiler
      # than the product. install-action verifies the release checksum and
      # installs the pinned prebuilt binary instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses / bans / advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # cargo-deny reads Cargo.lock directly (no build), so no rust-cache is
    # needed. `deny.toml` governs the checks: advisories + licenses + the
    # explicitly banned crates (openssl, rustls-ffi) are failures, while
    # duplicate-version and unknown-source hits are non-fatal warnings. This
    # complements the `audit` job by additionally enforcing the license
    # allow-list and crate bans that rustsec/audit-check does not cover.
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace
          command: check
