[workspace]
members = [
    "crates/*",
    "apps/tui/crates/mutx",
    "apps/tui/crates/mutx-engine",
]
default-members = ["crates/muta", "apps/tui/crates/mutx"]
resolver = "2"

[workspace.package]
version = "0.34.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Shared external dependencies, pinned once here. Crates reference them with
# `dep = { workspace = true }` (optionally adding features). Internal crates
# stay as path dependencies in each member's Cargo.toml.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
semver = "1.0"
toml = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "stream", "socks", "gzip", "brotli", "query", "form"] }
glob = "0.3"
walkdir = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
httpdate = "1"
fastrand = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
inventory = "0.3"
# Proc-macro support for the tool-schema derive (muta-tool-derive).
syn = { version = "2", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# TypeScript binding generation for the web app's wire types: muta-contracts
# derives `ts_rs::TS` on the payload types and exports them to
# apps/web/src/lib/generated/wire.gen.ts when `cargo test -p muta-contracts`
# runs (CI fails on drift). serde-compat stays on (it is what maps
# rename/rename_all/tag/untagged/default onto the generated types);
# no-serde-warnings only silences the advisory warning for serde attrs that
# carry no TypeScript meaning — `alias` (deserialize-only legacy spellings)
# and `transparent` (the generated type already equals the inner type because
# ts-rs renders single-field newtypes as that field's type).
ts-rs = { version = "12", features = ["no-serde-warnings"] }
windows-sys = "0.61"

# TUI stack. crossterm is the low-level terminal I/O layer (raw mode, input,
# alt screen, escape-code emission); the shared `crossterm` feature set is
# pinned once here. `mutx-engine` is the in-house grid + diff rendering
# engine (ADR-0038) and the `mutx` app consumes it.
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
similar = { version = "2", features = ["unicode"] }

# Shared diagnostics and test support used by more than one member.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
insta = "1.48"
mockito = "1"
tempfile = "3"

# Workspace-wide lint policy (inherited by every member via `lints.workspace =
# true`). `unwrap_used` / `expect_used` are *warnings*, not denies: keeping them
# as warnings makes every new, unguarded `unwrap`/`expect` visible in review.
# The codebase deliberately recovers from `Mutex` poisoning instead of panicking
# (the `unwrap_or_else(|e| e.into_inner())` idiom), so production lock sites do
# not trip this lint. The remaining documented structural invariants (a
# match-guarded `pop_front`, a parse of a compile-time constant,
# `chars().next()` on a grapheme that parses to ≥1 char) are acceptable.
# Tests are exempted: they should panic on assertion failure, so each crate's
# `lib.rs` allows both lints under `#[cfg_attr(test, ...)]`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Keep local builds and test binaries useful for backtraces without embedding
# full dependency debug information in every linked artifact. Full symbols can
# still be requested for a focused debugging session with CARGO_PROFILE_*.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0
