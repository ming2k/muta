# .config/nextest.toml
# Nextest configuration for muta workspace.

[profile.default]
# Kill hung tests after 15s
slow-timeout = { period = "15s", terminate-after = 1 }
retries = 0

# Extended timeouts for heavy integration tests
[[profile.default.overrides]]
filter = 'test(serve_integration) | test(daemon_spawn) | test(lifecycle_integration)'
slow-timeout = { period = "45s", terminate-after = 1 }
threads-required = 2

[profile.ci]
retries = 1
failure-output = "immediate-final"
