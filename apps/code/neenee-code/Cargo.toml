[package]
name = "neenee-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "neenee-code"
path = "src/main.rs"

[dependencies]
neenee-core = { path = "../../../crates/platform/neenee-core" }
neenee-store = { path = "../../../crates/platform/neenee-store" }
neenee-providers = { path = "../../../crates/providers/neenee-providers" }
neenee-tools = { path = "../../../crates/platform/neenee-tools" }
neenee-skills = { path = "../../../crates/platform/neenee-skills" }
neenee-mcp = { path = "../../../crates/platform/neenee-mcp" }
neenee-agent = { path = "../../../crates/platform/neenee-agent" }
neenee-session = { path = "../../../crates/platform/neenee-session" }
neenee-tui = { path = "../neenee-tui" }
neenee-tui-view = { path = "../neenee-tui-view" }
async-trait = { workspace = true }
crossterm = { workspace = true }
arboard = "3.6"
dirs = { workspace = true }
unicode-width = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
unicode-segmentation.workspace = true
webbrowser = { version = "1.2", features = ["hardened"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
