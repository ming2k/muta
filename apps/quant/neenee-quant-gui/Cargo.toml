[package]
name = "neenee-quant-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "neenee-quant-gui"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:iris"]
longport = ["neenee-quant/longport"]

[dependencies]
neenee-core = { path = "../../../crates/platform/neenee-core" }
neenee-quant = { path = "../neenee-quant" }
neenee-intelligence = { path = "../neenee-intelligence" }
iris = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[build-dependencies]
# Bake optics runtime search paths into the GUI binary. The optics `-sys`
# crates already use this package, so this introduces no new dependency family.
pkg-config = "0.3"

[lints]
workspace = true
