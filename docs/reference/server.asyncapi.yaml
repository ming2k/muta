asyncapi: 3.1.0
info:
  title: muta session-host WebSocket API
  version: 0.36.7
  description: |
    Machine-readable contract for the unified session-daemon transport
    (`muta daemon start --fg`; ADR-0081/0089/0093/0094/0096/0119).
    One process owns every session across every project and serves them over a
    single WebSocket endpoint (Unix domain socket by default, TCP + bearer token
    when exposed). Client roles share the socket, distinguished by the client's
    first frame (`Select`):

    - **Attach** (`Select{action: new | attach(id?)}`): bidirectional. The
      server answers `Welcome` (bound; full transcript), `Pick` (several
      sessions; choose one), or `Error`, then streams `Response` frames and
      accepts `Request` frames.
    - **Monitor** (`Select{action: monitor{watch, include_idle}}`, ADR-0093):
      server → client, read-only. The server sends one `Monitor{kind:
      snapshot}` frame, then `session_added` / `session_updated` /
      `session_removed` diffs while `watch` holds (`watch: false` closes after
      the snapshot). Rows are whole `MonitoredSession` values; upsert by `id`.
    - **Control** (`Select{action: {control: {verb, …}}}`, ADR-0096): one
      round-trip session management — create_session / send_prompt / interrupt
      / resolve_permission / suspend_session / kill_session / shutdown —
      answered by a `ControlReply`.

    Every WebSocket text frame contains exactly one JSON value. Binary frames
    are ignored. There are no sequence numbers or replay cursors: an attach
    reconnect starts from a fresh `Welcome`, a monitor reconnect from a fresh
    `snapshot`.

    Authentication (ADR-0054/0105): the Unix domain socket needs no token
    (filesystem permissions are the boundary). The TCP listeners accept the
    token either as `Authorization: Bearer <token>` (clients that can set
    headers) or as a `Sec-WebSocket-Protocol: bearer.<token>` offer (the
    browser channel, echoed on accept). `--public` requires a token always
    (HTTP 401 otherwise); the loopback listener requires one by default via
    `[daemon] local_auth` (the per-start token lives in the owner-only
    discovery record; `--no-local-auth` opts out). Loopback handshakes that
    carry a browser `Origin` are accepted only when the origin host is itself
    loopback (WebSocket is not same-origin-protected). The TCP port also
    serves plain HTTP `GET`/`HEAD /healthz`, an unauthenticated
    `{version, auth}` probe; all other HTTP paths return 404. Frontend assets
    are independently deployed, never embedded. There is no TLS; front a
    public deployment with a TLS-terminating reverse proxy.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  externalDocs:
    description: Human-readable frontend integration guide
    url: https://github.com/ming2k/muta/blob/main/docs/reference/server-api.md
defaultContentType: application/json
servers:
  uds:
    host: $XDG_RUNTIME_DIR/muta/daemon.sock
    protocol: ws
    description: |
      Default (ADR-0096). The unified daemon's primary local channel is a Unix
      domain socket (0600 in a 0700 runtime dir); filesystem permissions are
      the auth boundary, so no bearer token. CLI and TUI connect here.
  loopback:
    host: 127.0.0.1:{port}
    protocol: ws
    description: |
      TCP loopback (ADR-0105). A bearer token is required by default
      (`[daemon] local_auth`; per-start token in the owner-only discovery
      record; `--no-local-auth` opts out): `Authorization: Bearer <token>` or
      the `bearer.<token>` subprotocol. Browser `Origin` headers must be
      loopback-hosted.
    security:
      - bearerAuth: []
    variables:
      port:
        default: '9800'
        description: Fixed default port; ephemeral fallback when taken.
  exposed:
    host: 0.0.0.0:{port}
    protocol: ws
    description: |
      `muta daemon start --fg --public` binds
      all interfaces for LAN clients (ADR-0096).
      A bearer token is mandatory: send `Authorization: Bearer <token>` on the
      handshake, else HTTP 401. The daemon writes the token to its owner-only
      discovery record; `muta daemon token` prints it on explicit operator
      request. Front with TLS for remote use.
    security:
      - bearerAuth: []
    variables:
      port:
        default: '0'
        description: Actual bound port printed by the daemon after startup.
channels:
  session:
    address: /
    description: |
      One connection to the host. The client's first frame (`Select`) chooses
      the role: attach (bidirectional session driving), monitor (read-only
      observability stream), or control (session management).
    messages:
      select:
        $ref: '#/components/messages/Select'
      request:
        $ref: '#/components/messages/Request'
      welcome:
        $ref: '#/components/messages/Welcome'
      pick:
        $ref: '#/components/messages/Pick'
      error:
        $ref: '#/components/messages/Error'
      response:
        $ref: '#/components/messages/Response'
      monitor:
        $ref: '#/components/messages/Monitor'
      controlReply:
        $ref: '#/components/messages/ControlReply'
operations:
  sendSelect:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: First frame on every connection; chooses the client role.
    messages:
      - $ref: '#/channels/session/messages/select'
  sendRequest:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: Send an agent command from an attach client to the server.
    messages:
      - $ref: '#/channels/session/messages/request'
  receiveWelcome:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Attach handshake reply carrying the bound session's transcript snapshot.
    messages:
      - $ref: '#/channels/session/messages/welcome'
  receivePick:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Attach handshake reply listing candidate sessions to choose from.
    messages:
      - $ref: '#/channels/session/messages/pick'
  receiveMonitor:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: "Monitor stream: one snapshot, then whole-row diffs while watching."
    messages:
      - $ref: '#/channels/session/messages/monitor'
  sendControl:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: "Issue a session-management verb (create/prompt/interrupt/approve/suspend/kill)."
    messages:
      - $ref: '#/channels/session/messages/select'
  receiveControlReply:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: "The single reply to a control verb."
    messages:
      - $ref: '#/channels/session/messages/controlReply'
  receiveResponse:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Receive live agent and session events.
    messages:
      - $ref: '#/channels/session/messages/response'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: a 32-char hex token generated by the TUI on `--public`
      description: |
        Required only on the `public` server. Send `Authorization: Bearer <token>`
        on the WebSocket handshake. The loopback server requires no auth.
  messages:
    Request:
      name: Request
      title: Frontend request envelope
      payload:
        $ref: '#/components/schemas/RequestEnvelope'
      examples:
        - name: chat
          payload:
            type: Request
            Chat:
              text: Hello
              images: []
              sent_at_ms: 1770000000000
        - name: interrupt
          payload:
            type: Request
            Interrupt: null
    Select:
      name: Select
      title: Handshake selector (first frame on every connection)
      payload:
        $ref: '#/components/schemas/SelectEnvelope'
      examples:
        - name: attachAny
          payload:
            type: Select
            action:
              attach: null
        - name: monitorWatch
          payload:
            type: Select
            action:
              monitor:
                watch: true
                include_idle: false
        - name: control
          payload:
            type: Select
            action:
              control:
                verb: create_session
                project: /abs/path
        - name: controlShutdown
          payload:
            type: Select
            version: 0.36.7
            action:
              control:
                verb: shutdown
    Welcome:
      name: Welcome
      title: Attach handshake reply with the bound session's transcript
      payload:
        $ref: '#/components/schemas/WelcomeEnvelope'
      examples:
        - name: emptyWelcome
          payload:
            type: Welcome
            session_id: session-123
            round_counter: 0
            messages: []
    Pick:
      name: Pick
      title: Attach handshake reply listing candidate sessions
      payload:
        $ref: '#/components/schemas/PickEnvelope'
      examples:
        - name: twoSessions
          payload:
            type: Pick
            sessions:
              - id: session-123
                overview: fix the parser
                created_at: 1786100000
                updated_at: 1786100100
                message_count: 9
                active: true
    Error:
      name: Error
      title: Terminal handshake or request error
      payload:
        $ref: '#/components/schemas/ErrorEnvelope'
      examples:
        - name: unknownId
          payload:
            type: Error
            message: unknown session id 'nope'
    Monitor:
      name: Monitor
      title: Monitor stream frame (snapshot or whole-row diff)
      payload:
        $ref: '#/components/schemas/MonitorEnvelope'
      examples:
        - name: snapshot
          payload:
            type: Monitor
            kind: snapshot
            project_root: /home/u/proj
            daemon_started_at: 1786100000
            sessions: []
        - name: sessionUpdated
          payload:
            type: Monitor
            kind: session_updated
            id: session-123
            overview: fix the parser
            created_at: 1786100000
            updated_at: 1786100123
            message_count: 14
            hosting: hosted
            status: running
            round: 3
            turn: 1
            output_tokens: 512
            elapsed_ms: 83000
            current_tool: execute_command
            activity: waiting for model
            context_tokens: 48200
            note: null
        - name: sessionRemoved
          payload:
            type: Monitor
            kind: session_removed
            session_id: session-123
        - name: daemonDraining
          payload:
            type: Monitor
            kind: daemon_draining
    ControlReply:
      name: ControlReply
      title: Reply to a control-plane verb (ADR-0096)
      payload:
        $ref: '#/components/schemas/ControlReplyEnvelope'
      examples:
        - name: created
          payload:
            type: ControlReply
            ok: true
            session_id: session-123
        - name: failure
          payload:
            type: ControlReply
            ok: false
            error: unknown session id 'nope'
    Response:
      name: Response
      title: Live server response envelope
      payload:
        $ref: '#/components/schemas/ResponseEnvelope'
      examples:
        - name: streamingDelta
          payload:
            type: Response
            Round:
              session_id: session-123
              event:
                StreamDelta: Hello
        - name: permissionPrompt
          payload:
            type: Response
            Round:
              session_id: session-123
              event:
                PermissionRequest:
                  id: permission-123
                  tool: edit_file
                  label: Edit file
                  description: Modify a project file
                  arguments: '{"path":"README.md"}'
                  scope: README.md
  schemas:
    RequestEnvelope:
      description: |
        `type` is the outer Wire discriminator. The second discriminator is the
        Rust `AgentRequest` variant name. Unit variants serialize as a key with
        a null value because they are flattened into this envelope.
      type: object
      required: [type]
      properties:
        type:
          const: Request
      allOf:
        - $ref: '#/components/schemas/AgentRequest'
      unevaluatedProperties: false
    SelectEnvelope:
      description: |
        The first frame on every connection. `action` is one of `"new"`,
        `{ "attach": "<id>" | null }`, `"picker"`,
        `{ "monitor": { watch, include_idle } }`,
        or `{ "control": { verb, … } }` (serde `rename_all = "snake_case"`).
        `protocol` (ADR-0134), when present, is the compatibility authority:
        the daemon serves any number in its window
        [MIN_PROTOCOL_VERSION, PROTOCOL_VERSION] regardless of build, and
        refuses anything outside it with `Error{code: "protocol_mismatch"}`
        before any session work. `version` is the client's product build —
        advisory when `protocol` is present, still enforced by exact
        equality (ADR-0100 rule 4) when it is not. Both absent means
        "legacy client" and is served.
      type: object
      required: [type, action]
      properties:
        type:
          const: Select
        action:
          description: AttachAction; see examples on the Select message.
        protocol:
          type: integer
          minimum: 1
          description: >
            The wire protocol number this client speaks (ADR-0134), from
            PROTOCOL_VERSION in crates/muta-contracts/src/wire.rs.
        version:
          type: string
          description: The client's CARGO_PKG_VERSION for skew detection.
      additionalProperties: false
    WelcomeEnvelope:
      type: object
      required: [type, session_id, round_counter, messages]
      properties:
        type:
          const: Welcome
        session_id:
          type: string
          description: Id of the hosted session this transcript snapshot belongs to.
        round_counter:
          type: integer
          minimum: 0
          description: Authoritative monotonic round counter for the hosted session.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        round_interrupts:
          type: array
          description: >
            Durable round-interrupt records (C11) to re-project into the
            transcript at their timestamp seams. Absent on older daemons.
          items:
            $ref: '#/components/schemas/RoundInterrupt'
        provider:
          type: string
          description: >
            Provider instance id the session is currently serving (its own pin
            when set, else the config default at bind time). Empty when no
            provider is configured.
        model:
          type: string
          description: Wire model id the session is currently serving. Empty when no model resolves.
        command_catalog:
          $ref: '#/components/schemas/CommandCatalog'
          description: >
            Backend command metadata for help and presentation. Completion
            matching remains server-owned through CompleteInput.
      additionalProperties: false
    PickEnvelope:
      type: object
      required: [type, sessions]
      properties:
        type:
          const: Pick
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionOverview'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [type, message]
      properties:
        type:
          const: Error
        message:
          type: string
        code:
          type: string
          enum: [version_mismatch]
          description: Stable machine-readable reason (ADR-0105); absent on older daemons.
      additionalProperties: false
    SessionOverview:
      type: object
      required: [id, overview, created_at, updated_at, message_count, active]
      properties:
        id:
          type: string
        overview:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
        message_count:
          type: integer
        active:
          type: boolean
      additionalProperties: false
    SessionTree:
      description: Replacement snapshot of the current session conversation DAG.
      type: object
      required: [entries, root_id, active_leaf_id, named_branches]
      properties:
        entries:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SessionEntry' }
        root_id: { type: [string, 'null'] }
        active_leaf_id: { type: [string, 'null'] }
        named_branches:
          type: object
          additionalProperties: { type: string }
      additionalProperties: false
    SessionEntry:
      description: One flattened node in the session conversation DAG.
      oneOf:
        - $ref: '#/components/schemas/SessionMessageEntry'
        - $ref: '#/components/schemas/SessionCompactionEntry'
        - $ref: '#/components/schemas/SessionBranchSummaryEntry'
        - $ref: '#/components/schemas/SessionCustomEntry'
      discriminator:
        propertyName: type
    SessionMessageEntry:
      type: object
      required: [id, parent_id, timestamp, type, message]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'] }
        timestamp: { type: integer, minimum: 0 }
        type: { const: message }
        message: { $ref: '#/components/schemas/Message' }
      additionalProperties: false
    SessionCompactionEntry:
      type: object
      required: [id, parent_id, timestamp, type, summary, first_kept_entry_id, tokens_before, read_files, modified_files]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'] }
        timestamp: { type: integer, minimum: 0 }
        type: { const: compaction }
        summary: { type: string }
        first_kept_entry_id: { type: string }
        tokens_before: { type: integer, minimum: 0 }
        read_files: { type: array, items: { type: string } }
        modified_files: { type: array, items: { type: string } }
      additionalProperties: false
    SessionBranchSummaryEntry:
      type: object
      required: [id, parent_id, timestamp, type, summary, from_id, read_files, modified_files]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'] }
        timestamp: { type: integer, minimum: 0 }
        type: { const: branch_summary }
        summary: { type: string }
        from_id: { type: string }
        read_files: { type: array, items: { type: string } }
        modified_files: { type: array, items: { type: string } }
      additionalProperties: false
    SessionCustomEntry:
      type: object
      required: [id, parent_id, timestamp, type, custom_type, content, display]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'] }
        timestamp: { type: integer, minimum: 0 }
        type: { const: custom }
        custom_type: { type: string }
        content: { type: string }
        display: { type: [string, 'null'] }
      additionalProperties: false
    MonitoredSession:
      description: |
        One control-panel row (ADR-0093/0095). `hosting` is always
        `hosted` under the unified daemon (ADR-0096). `status` is derived:
        idle | running | needs_approval | needs_input | interrupted | failed.
      type: object
      required:
        - id
        - overview
        - created_at
        - updated_at
        - message_count
        - status
        - round
        - turn
        - output_tokens
        - elapsed_ms
        - current_tool
        - activity
        - context_tokens
        - note
      properties:
        id:
          type: string
        overview:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
        message_count:
          type: integer
        hosting:
          enum: [hosted]
          default: hosted
        status:
          enum: [idle, running, needs_approval, needs_input, interrupted, failed]
        round:
          type: integer
          minimum: 0
        turn:
          type: [integer, "null"]
        output_tokens:
          type: integer
        elapsed_ms:
          type: integer
        current_tool:
          type: [string, "null"]
        activity:
          type: [string, "null"]
        context_tokens:
          type: [integer, "null"]
        note:
          type: [string, "null"]
        project_root:
          type: string
          description: >
            Absolute workspace path this session belongs to (ADR-0096). Empty
            for producers that predate the field.
      additionalProperties: false
    MonitorEnvelope:
      description: |
        `type` is the Wire discriminator; `kind` is the flattened MonitorEvent
        discriminator. `snapshot` carries MonitorSnapshot fields;
        `session_added` / `session_updated` carry whole MonitoredSession rows;
        `session_removed` carries `session_id`; `daemon_draining` (ADR-0101)
        carries nothing — it announces the daemon's graceful shutdown to
        watch clients right before the stream closes.
      type: object
      required: [type, kind]
      properties:
        type:
          const: Monitor
        kind:
          enum: [snapshot, session_added, session_updated, session_removed, daemon_draining]
    ControlReplyEnvelope:
      type: object
      required: [type, ok]
      properties:
        type:
          const: ControlReply
        ok:
          type: boolean
        session_id:
          type: [string, 'null']
        error:
          type: [string, 'null']
      additionalProperties: false
    ResponseEnvelope:
      description: "The type field plus one flattened AgentResponse variant."
      type: object
      required: [type]
      properties:
        type:
          const: Response
      allOf:
        - $ref: '#/components/schemas/AgentResponse'
      unevaluatedProperties: false

    CommandCatalog:
      type: object
      required: [commands, aliases, suggestions]
      properties:
        commands:
          type: array
          items: { $ref: '#/components/schemas/CommandSpec' }
        aliases:
          type: array
          items: { $ref: '#/components/schemas/CommandAlias' }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/CommandSuggestion' }
      additionalProperties: false
    CommandSpec:
      type: object
      required: [name, summary, description, usage, examples, intent_keywords]
      properties:
        name: { type: string, examples: [/models] }
        summary: { type: string }
        description: { type: string }
        usage:
          type: array
          items: { type: string }
        examples:
          type: array
          items: { $ref: '#/components/schemas/CommandExample' }
        intent_keywords:
          type: array
          items: { type: string }
        category: { type: string }
      additionalProperties: false
    CommandExample:
      type: object
      required: [command, description]
      properties:
        command: { type: string }
        description: { type: string }
      additionalProperties: false
    CommandAlias:
      type: object
      required: [name, target]
      properties:
        name: { type: string }
        target: { type: string }
      additionalProperties: false
    CommandSuggestion:
      type: object
      required: [trigger, target, reason]
      properties:
        trigger: { type: string }
        target: { type: string }
        reason: { type: string }
      additionalProperties: false
    InputCompletion:
      description: >
        Backend-produced composer edit. Replacement offsets are Unicode-scalar
        indices; the client splices insert_text verbatim over the range.
      type: object
      required: [label, description, insert_text, replace_start, replace_end, kind]
      properties:
        label: { type: string }
        description: { type: string }
        insert_text: { type: string }
        replace_start: { type: integer, minimum: 0 }
        replace_end: { type: integer, minimum: 0 }
        kind:
          enum: [slash, intent, path_file, path_dir, path_explicit]
        command: { $ref: '#/components/schemas/CommandSpec' }
      additionalProperties: false

    AgentRequest:
      oneOf:
        - $ref: '#/components/schemas/RequestChat'
        - $ref: '#/components/schemas/RequestSlashCommand'
        - $ref: '#/components/schemas/RequestCompleteInput'
        - $ref: '#/components/schemas/RequestInterrupt'
        - $ref: '#/components/schemas/RequestPermissionReply'
        - $ref: '#/components/schemas/RequestUserQuestionReply'
        - $ref: '#/components/schemas/RequestInputReply'
        - $ref: '#/components/schemas/RequestSwitchProvider'
        - $ref: '#/components/schemas/RequestAddProvider'
        - $ref: '#/components/schemas/RequestConnectProvider'
        - $ref: '#/components/schemas/RequestAuthorizeOAuth'
        - $ref: '#/components/schemas/RequestEditProvider'
        - $ref: '#/components/schemas/RequestRemoveProviderModel'
        - $ref: '#/components/schemas/RequestEditProviderModel'
        - $ref: '#/components/schemas/RequestEditModelReasoning'
        - $ref: '#/components/schemas/RequestDeleteProvider'
        - $ref: '#/components/schemas/RequestToggleFavorite'
        - $ref: '#/components/schemas/RequestSetDefaultModel'
        - $ref: '#/components/schemas/RequestDeleteSession'
        - $ref: '#/components/schemas/RequestRenameSession'
        - $ref: '#/components/schemas/RequestQuerySessionsOverview'
        - $ref: '#/components/schemas/RequestQuerySessionTree'
        - $ref: '#/components/schemas/RequestQuerySessionContext'
        - $ref: '#/components/schemas/RequestRevokePermission'
        - $ref: '#/components/schemas/RequestClearAllPermissions'
        - $ref: '#/components/schemas/RequestToggleTool'
        - $ref: '#/components/schemas/RequestToggleMcpServer'
        - $ref: '#/components/schemas/RequestReconnectMcpServer'
        - $ref: '#/components/schemas/RequestShellCommand'
        - $ref: '#/components/schemas/RequestExitSideView'
        - $ref: '#/components/schemas/RequestUpdateTuiLayout'
        - $ref: '#/components/schemas/RequestQueryWebSearchConfig'
        - $ref: '#/components/schemas/RequestUpdateWebSearchConfig'
        - $ref: '#/components/schemas/RequestRefreshProviderModels'
    RequestChat:
      type: object
      required: [Chat]
      properties:
        Chat:
          type: object
          required: [text, images]
          properties:
            text: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImagePart' }
            sent_at_ms: { type: [integer, 'null'], minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    RequestSlashCommand:
      type: object
      required: [SlashCommand]
      properties:
        SlashCommand: { type: string, examples: [/help] }
      additionalProperties: false
    RequestCompleteInput:
      type: object
      required: [CompleteInput]
      properties:
        CompleteInput:
          type: object
          required: [request_id, input, cursor]
          properties:
            request_id: { type: integer, minimum: 0 }
            input: { type: string }
            cursor:
              type: integer
              minimum: 0
              description: Unicode-scalar offset into input.
          additionalProperties: false
      additionalProperties: false
    RequestInterrupt: { $ref: '#/components/schemas/UnitRequestInterrupt' }
    UnitRequestInterrupt:
      type: object
      required: [Interrupt]
      properties: { Interrupt: { type: 'null' } }
      additionalProperties: false
    RequestPermissionReply:
      type: object
      required: [PermissionReply]
      properties:
        PermissionReply:
          type: object
          required: [request_id, decision, parent_call_id]
          properties:
            request_id: { type: string }
