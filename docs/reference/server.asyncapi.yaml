      properties: { QueryWebSearchConfig: { type: 'null' } }
      additionalProperties: false
    RequestUpdateWebSearchConfig:
      description: |
        PATCH the `[websearch]` table: absent fields keep their values. Behavior
        fields persist to config.toml; API keys persist to credentials.toml and
        an empty-string value CLEARS the stored key. The daemon validates,
        persists, hot-applies to the live web tools, and replies with
        ResponseWebSearchConfigUpdated (key presence only).
      type: object
      required: [UpdateWebSearchConfig]
      properties:
        UpdateWebSearchConfig: { $ref: '#/components/schemas/WebSearchConfigUpdate' }
      additionalProperties: false
    WebSearchConfigUpdate:
      type: object
      properties:
        provider: { type: string, enum: [exa, parallel, duckduckgo, ddg, searxng, tavily, bocha] }
        fallback: { type: string, description: 'Empty string disables the fallback.' }
        reader: { type: string, enum: [jina] }
        proxy: { type: string, description: 'Empty string clears it.' }
        timeout_secs: { type: integer, minimum: 1 }
        searxng_url: { type: string, description: 'Required when a backend is searxng; empty clears.' }
        exa_api_key: { type: string }
        parallel_api_key: { type: string }
        tavily_api_key: { type: string }
        bocha_api_key: { type: string }
        jina_api_key: { type: string }
      additionalProperties: false
    WebSearchConfigView:
      description: |
        The effective `[websearch]` configuration with every API key reduced to
        a boolean presence flag — plaintext secrets never cross the wire.
      type: object
      required:
        [provider, fallback, reader, timeout_secs, exa_api_key_set, parallel_api_key_set,
         tavily_api_key_set, bocha_api_key_set, jina_api_key_set]
      properties:
        provider: { type: string }
        fallback: { type: string }
        reader: { type: string }
        proxy: { type: string }
        timeout_secs: { type: integer, minimum: 1 }
        searxng_url: { type: string }
        exa_api_key_set: { type: boolean }
        parallel_api_key_set: { type: boolean }
        tavily_api_key_set: { type: boolean }
        bocha_api_key_set: { type: boolean }
        jina_api_key_set: { type: boolean }
    RequestRefreshProviderModels:
      type: object
      required: [RefreshProviderModels]
      properties:
        RefreshProviderModels:
          type: object
          properties:
            user_initiated: { type: boolean, default: false }
          additionalProperties: false
      additionalProperties: false

    AgentResponse:
      description: |
        Externally tagged Rust enum. This contract enumerates all top-level
        response variants. Detailed schemas are provided for the interaction,
        streaming, and state-sync paths most frontends consume; large evolving
        snapshots retain an open object payload where noted.
      oneOf:
        - $ref: '#/components/schemas/ResponseRound'
        - $ref: '#/components/schemas/ResponseInputCompletions'
        - $ref: '#/components/schemas/ResponseParentStatus'
        - $ref: '#/components/schemas/ResponseSideViewOpened'
        - $ref: '#/components/schemas/ResponseSideViewClosed'
        - $ref: '#/components/schemas/ResponsePermissionsCleared'
        - $ref: '#/components/schemas/ResponseProviderKeys'
        - $ref: '#/components/schemas/ResponseProviderPicker'
        - $ref: '#/components/schemas/ResponseConversationCleared'
        - $ref: '#/components/schemas/ResponseConversationReplaced'
        - $ref: '#/components/schemas/ResponseSessionsOverview'
        - $ref: '#/components/schemas/ResponseOpenSessionsPanel'
        - $ref: '#/components/schemas/ResponseSessionTreeSnapshot'
        - $ref: '#/components/schemas/ResponseOpenTreePanel'
        - $ref: '#/components/schemas/ResponseError'
        - $ref: '#/components/schemas/ResponseExit'
        - $ref: '#/components/schemas/ResponseProviderSwitched'
        - $ref: '#/components/schemas/ResponseConnectStatus'
        - $ref: '#/components/schemas/ResponseSessionContext'
        - $ref: '#/components/schemas/ResponseTuiLayoutUpdated'
        - $ref: '#/components/schemas/ResponseWebSearchConfigSnapshot'
        - $ref: '#/components/schemas/ResponseWebSearchConfigUpdated'
    ResponseRound:
      type: object
      required: [Round]
      properties:
        Round:
          type: object
          required: [session_id, event]
          properties:
            session_id: { type: string }
            event: { $ref: '#/components/schemas/RoundEvent' }
          additionalProperties: false
      additionalProperties: false
    ResponseInputCompletions:
      type: object
      required: [InputCompletions]
      properties:
        InputCompletions:
          type: object
          required: [request_id, input, cursor, items]
          properties:
            request_id: { type: integer, minimum: 0 }
            input: { type: string }
            cursor:
              type: integer
              minimum: 0
              description: Echoed Unicode-scalar cursor offset.
            items:
              type: array
              items: { $ref: '#/components/schemas/InputCompletion' }
          additionalProperties: false
      additionalProperties: false
    ResponseParentStatus:
      type: object
      required: [ParentStatus]
      properties: { ParentStatus: { enum: [Idle, Running, NeedsApproval, NeedsInput, Failed, Interrupted] } }
      additionalProperties: false
    ResponseSideViewOpened:
      type: object
      required: [SideViewOpened]
      properties:
        SideViewOpened:
          type: object
          required: [side_id, primary_id]
          properties: { side_id: { type: string }, primary_id: { type: string } }
          additionalProperties: false
      additionalProperties: false
    ResponseSideViewClosed: { $ref: '#/components/schemas/UnitResponseSideViewClosed' }
    UnitResponseSideViewClosed:
      type: string
      const: SideViewClosed
    ResponsePermissionsCleared: { type: string, const: PermissionsCleared }
    ResponseProviderKeys:
      type: object
      required: [ProviderKeys]
      properties:
        ProviderKeys:
          type: array
          items:
            type: array
            prefixItems: [{ type: string }, { type: boolean }]
            minItems: 2
            maxItems: 2
      additionalProperties: false
    ResponseProviderPicker:
      type: object
      required: [ProviderPicker]
      properties: { ProviderPicker: { $ref: '#/components/schemas/ProviderPickerSnapshot' } }
      additionalProperties: false
    ResponseConversationCleared: { type: string, const: ConversationCleared }
    ResponseConversationReplaced:
      type: object
      required: [ConversationReplaced]
      properties:
        ConversationReplaced:
          type: object
          required: [session_id, messages]
          description: >-
            Replacement snapshot after a session switch: dialogue, the
            command ledger (ADR-0091), and the round-interrupt records
            (C11) — the frontend rebuilds the whole document from these.
          properties:
            session_id: { type: string }
            messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
            commands:
              type: array
              items: { $ref: '#/components/schemas/CommandRecord' }
            round_interrupts:
              type: array
              items: { $ref: '#/components/schemas/RoundInterrupt' }
          additionalProperties: false
      additionalProperties: false
    ResponseSessionsOverview:
      type: object
      required: [SessionsOverview]
      properties:
        SessionsOverview: { type: array, items: { $ref: '#/components/schemas/SessionOverview' } }
      additionalProperties: false
    ResponseOpenSessionsPanel:
      type: object
      required: [OpenSessionsPanel]
      properties: { OpenSessionsPanel: { type: 'null' } }
      additionalProperties: false
    ResponseSessionTreeSnapshot:
      type: object
      required: [SessionTreeSnapshot]
      properties:
        SessionTreeSnapshot:
          type: object
          required: [session_id, tree]
          properties:
            session_id: { type: string }
            tree: { $ref: '#/components/schemas/SessionTree' }
          additionalProperties: false
      additionalProperties: false
    ResponseOpenTreePanel:
      type: object
      required: [OpenTreePanel]
      properties: { OpenTreePanel: { type: 'null' } }
      additionalProperties: false
    ResponseError:
      type: object
      required: [Error]
      properties: { Error: { type: string } }
      additionalProperties: false
    ResponseExit: { type: string, const: Exit }
    ResponseProviderSwitched:
      type: object
      required: [ProviderSwitched]
      properties:
        ProviderSwitched:
          type: object
          required: [provider, model]
          properties: { provider: { type: string }, model: { type: string } }
          additionalProperties: false
      additionalProperties: false
    ResponseConnectStatus:
      type: object
      required: [ConnectStatus]
      properties: { ConnectStatus: { $ref: '#/components/schemas/ConnectStatus' } }
      additionalProperties: false
    ResponseSessionContext:
      type: object
      required: [SessionContext]
      properties: { SessionContext: { $ref: '#/components/schemas/SessionContextSnapshot' } }
      additionalProperties: false
    ResponseTuiLayoutUpdated:
      type: object
      required: [TuiLayoutUpdated]
      properties: { TuiLayoutUpdated: { type: string } }
      additionalProperties: false
    ResponseWebSearchConfigSnapshot:
      type: object
      required: [WebSearchConfigSnapshot]
      properties: { WebSearchConfigSnapshot: { $ref: '#/components/schemas/WebSearchConfigView' } }
      additionalProperties: false
    ResponseWebSearchConfigUpdated:
      description: |
        Ack for RequestUpdateWebSearchConfig: the config was validated,
        persisted, and hot-applied to the live web tools. Carries the
        authoritative post-update view.
      type: object
      required: [WebSearchConfigUpdated]
      properties: { WebSearchConfigUpdated: { $ref: '#/components/schemas/WebSearchConfigView' } }
      additionalProperties: false

    RoundEvent:
      description: |
        Externally tagged event enum. Unknown future event keys should be logged
        and ignored by resilient frontends rather than terminating the socket.
      oneOf:
        - { $ref: '#/components/schemas/EventNotice' }
        - { $ref: '#/components/schemas/EventText' }
        - { $ref: '#/components/schemas/EventError' }
        - { $ref: '#/components/schemas/EventToolCall' }
        - { $ref: '#/components/schemas/EventToolResult' }
        - { $ref: '#/components/schemas/EventToolStream' }
        - { $ref: '#/components/schemas/EventToolCancelled' }
        - { $ref: '#/components/schemas/EventPermissionRequest' }
        - { $ref: '#/components/schemas/EventUserQuestionRequest' }
        - { $ref: '#/components/schemas/EventInputRequest' }
        - { $ref: '#/components/schemas/EventCompacted' }
        - { $ref: '#/components/schemas/EventHarnessState' }
        - { $ref: '#/components/schemas/EventTodosUpdated' }
        - { $ref: '#/components/schemas/EventDelegatedChanged' }
        - { $ref: '#/components/schemas/EventRetryScheduled' }
        - { $ref: '#/components/schemas/EventActivity' }
        - { $ref: '#/components/schemas/EventTurnStarted' }
        - { type: string, const: StreamStart }
        - { $ref: '#/components/schemas/EventStreamDelta' }
        - { $ref: '#/components/schemas/EventStreamReasoningDelta' }
        - { $ref: '#/components/schemas/EventStreamReasoningEnd' }
        - { $ref: '#/components/schemas/EventStreamEnd' }
        - { type: string, const: StreamDiscard }
        - { $ref: '#/components/schemas/EventUnsentInput' }
        - { $ref: '#/components/schemas/EventRoundInterrupted' }
        - { $ref: '#/components/schemas/EventEnvoy' }
    EventNotice:
      type: object
      required: [Notice]
      properties: { Notice: { $ref: '#/components/schemas/AgentNotice' } }
      additionalProperties: false
    EventText: { type: object, required: [Text], properties: { Text: { type: string } }, additionalProperties: false }
    EventError: { type: object, required: [Error], properties: { Error: { type: string } }, additionalProperties: false }
    EventToolCall:
      type: object
      required: [ToolCall]
      properties:
        ToolCall:
          type: object
          required: [id, name, arguments]
          properties: { id: { type: string }, name: { type: string }, arguments: { type: string } }
          additionalProperties: false
      additionalProperties: false
    EventToolResult:
      type: object
      required: [ToolResult]
      properties:
        ToolResult:
          type: object
          required: [id, name, output, structured, duration_ms]
          properties:
            id: { type: string }
            name: { type: string }
            output: { type: string }
            structured: { $ref: '#/components/schemas/ToolOutput' }
            duration_ms: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    EventToolStream:
      type: object
      required: [ToolStream]
      properties:
        ToolStream:
          type: object
          required: [id, stream]
          properties:
            id: { type: string }
            stream: { $ref: '#/components/schemas/ToolStream' }
          additionalProperties: false
      additionalProperties: false
    EventToolCancelled:
      type: object
      required: [ToolCancelled]
      properties:
        ToolCancelled:
          type: object
          required: [id, name]
          properties: { id: { type: string }, name: { type: string } }
          additionalProperties: false
      additionalProperties: false
    EventPermissionRequest:
      type: object
      required: [PermissionRequest]
      properties: { PermissionRequest: { $ref: '#/components/schemas/PermissionRequest' } }
      additionalProperties: false
    EventUserQuestionRequest:
      type: object
      required: [UserQuestionRequest]
      properties: { UserQuestionRequest: { $ref: '#/components/schemas/UserQuestionRequest' } }
      additionalProperties: false
    EventInputRequest:
      type: object
      required: [InputRequest]
      properties: { InputRequest: { $ref: '#/components/schemas/InputRequest' } }
      additionalProperties: false
    EventCompacted:
      type: object
      required: [Compacted]
      properties:
        Compacted:
          type: object
          required: [archived_messages, window_tokens_before, window_tokens_after]
          properties:
            archived_messages: { type: integer, minimum: 0 }
            window_tokens_before: { type: integer, minimum: 0 }
            window_tokens_after: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    EventHarnessState:
      type: object
      required: [HarnessState]
      properties:
        HarnessState:
          type: object
          required: [loop_status, round_counter, delegated]
          properties:
            loop_status: { type: string, enum: [idle, running] }
            round_counter: { type: integer, minimum: 0 }
            delegated:
              type: boolean
              description: >-
                Delegated autonomous execution posture (tool permission prompts
                bypassed). Servers also accept the legacy `yolo`/`autopilot`
                field spellings on deserialize; new writes use `delegated`.
          additionalProperties: false
      additionalProperties: false
    EventTodosUpdated:
      type: object
      required: [TodosUpdated]
      properties: { TodosUpdated: { $ref: '#/components/schemas/TodoList' } }
      additionalProperties: false
    EventDelegatedChanged: { type: object, required: [DelegatedChanged], properties: { DelegatedChanged: { type: boolean } }, additionalProperties: false }
    EventRetryScheduled:
      type: object
      required: [RetryScheduled]
      properties:
        RetryScheduled:
          type: object
          required: [attempt, max_attempts, delay_ms, message]
          properties:
            attempt: { type: integer, minimum: 0 }
            max_attempts: { type: integer, minimum: 0 }
            delay_ms: { type: integer, minimum: 0 }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
    EventActivity: { type: object, required: [Activity], properties: { Activity: { type: string } }, additionalProperties: false }
    EventTurnStarted:
      type: object
      required: [TurnStarted]
      properties:
        TurnStarted:
          type: object
          required: [round, turn]
          properties:
            round: { type: integer, minimum: 1 }
            turn: { type: integer, minimum: 0 }
          additionalProperties: false
      additionalProperties: false
    EventStreamDelta: { type: object, required: [StreamDelta], properties: { StreamDelta: { type: string } }, additionalProperties: false }
    EventStreamReasoningDelta: { type: object, required: [StreamReasoningDelta], properties: { StreamReasoningDelta: { type: string } }, additionalProperties: false }
    EventStreamReasoningEnd: { type: object, required: [StreamReasoningEnd], properties: { StreamReasoningEnd: { type: string } }, additionalProperties: false }
    EventStreamEnd: { type: object, required: [StreamEnd], properties: { StreamEnd: { type: string } }, additionalProperties: false }
    EventUnsentInput:
      type: object
      required: [UnsentInput]
      properties:
        UnsentInput:
          type: object
          required: [prompt, images]
          description: >-
            Phase-1 interrupt payload: the round was cancelled before any
            content delta reached the client and the conversation was
            reverted to its pre-send state. `prompt`/`images` are offered
            back for re-editing; restoring into the composer is advisory
            (a client with in-progress input should surface the prompt
            another way rather than clobber it).
          properties:
            prompt: { type: string }
            images: { type: array, items: { $ref: '#/components/schemas/ImagePart' } }
          additionalProperties: false
      additionalProperties: false
    EventRoundInterrupted:
      type: object
      required: [RoundInterrupted]
      properties:
        RoundInterrupted:
          $ref: '#/components/schemas/RoundInterrupt'
      additionalProperties: false
    EventEnvoy:
      type: object
      required: [Envoy]
      properties:
        Envoy:
          type: object
          required: [parent_call_id, event]
          properties:
            parent_call_id: { type: string }
            event: { $ref: '#/components/schemas/EnvoyEvent' }
          additionalProperties: false
      additionalProperties: false

    EnvoyEvent:
      description: Nested envoy event; uses the same external enum representation.
      oneOf:
        - type: object
          required: [Started]
          properties: { Started: { type: object, required: [profile], properties: { profile: { type: string } }, additionalProperties: false } }
          additionalProperties: false
        - { $ref: '#/components/schemas/EventNotice' }
        - { type: string, const: StreamStart }
        - { $ref: '#/components/schemas/EventStreamDelta' }
        - { $ref: '#/components/schemas/EventStreamEnd' }
        - { $ref: '#/components/schemas/EventToolCall' }
        - type: object
          required: [ToolResult]
          properties:
            ToolResult:
              type: object
              required: [id, name, output, duration_ms]
              properties:
                id: { type: string }
                name: { type: string }
                output: { type: string }
                duration_ms: { type: integer, minimum: 0 }
              additionalProperties: false
          additionalProperties: false
        - { $ref: '#/components/schemas/EventActivity' }
        - { $ref: '#/components/schemas/EventPermissionRequest' }
        - { $ref: '#/components/schemas/EventUserQuestionRequest' }
        - { $ref: '#/components/schemas/EventInputRequest' }

    AgentNotice:
      type: object
      required: [id, kind, severity, surface, title, source]
      properties:
        id: { type: string }
        kind: { enum: [provider_retry, nudge_injected, review_alert] }
        severity: { enum: [info, warning, error] }
        surface: { enum: [inline, toast, banner] }
        title: { type: string }
        body: { type: [string, 'null'] }
        source: { enum: [agent, turn_guard, todo, review, harness] }
      additionalProperties: false
    PermissionRequest:
      type: object
      required: [id, tool, label, description, arguments, scope]
      properties:
        id: { type: string }
        tool: { type: string }
        label: { type: string }
        description: { type: string }
        arguments: { type: string, description: JSON encoded as a string }
        scope: { type: string }
        elevation:
          type: boolean
          description: >
            True when the call is outside the agent's granted OperationScope —
            the user is authorising access beyond the configured boundary
            (ADR-0028 soft scope-gate).
        one_off:
          type: boolean
          description: >
            True when `Always` is not honoured (the command-policy confirm gate);
            clients should suppress the always-allow option.
      additionalProperties: false
    UserQuestionRequest:
      type: object
      required: [id, questions]
      properties:
        id: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [question, options, multi_select]
            properties:
              header: { type: [string, 'null'] }
              question: { type: string }
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string }
                    description: { type: [string, 'null'] }
                  additionalProperties: false
              multi_select: { type: boolean }
            additionalProperties: false
      additionalProperties: false
    InputRequest:
      type: object
      required: [id, command, prompt, secret]
      properties:
        id: { type: string }
        command: { type: string }
        prompt: { type: string }
        secret: { type: boolean }
      additionalProperties: false
    ImagePart:
      type: object
      required: [mime, data]
      properties:
        mime: { type: string, examples: [image/png] }
        data: { type: string, contentEncoding: base64 }
      additionalProperties: false
    Message:
      description: |
        Persisted transcript message. The core fields are stable; optional
        metadata is intentionally open because the transcript model evolves
        independently and the Welcome snapshot must remain forward-compatible.
      type: object
      required: [role, content]
      properties:
        role: { enum: [User, Assistant, System, Tool] }
        content: { type: string }
        content_blob: { type: [string, 'null'] }
        display_content: { type: [string, 'null'] }
        reasoning_content: { type: [string, 'null'] }
        images: { type: array, items: { $ref: '#/components/schemas/ImagePart' } }
        tool_call_id: { type: [string, 'null'] }
        hidden: { type: boolean }
        children: { type: array, items: { $ref: '#/components/schemas/Message' } }
        sent_at_ms: { type: [integer, 'null'], minimum: 0 }
        timestamp: { type: [integer, 'null'], minimum: 0, description: Unix-epoch seconds. }
      additionalProperties: true
    RoundInterrupt:
      description: |
        Durable record of one round stopped before completing (C11).
        Projection state only — never part of the model-visible context.
      type: object
      required: [reason, at_ms]
      properties:
        reason:
          enum: [user, superseded, terminated]
          description: >
            `user` — explicit Esc Esc / control-plane interrupt; `superseded`
            — a newer round or session switch replaced this one; `terminated`
            — the host process stopped or died with the round in flight.
        at_ms: { type: integer, minimum: 0, description: Unix-epoch milliseconds at the stop. }
        round: { type: [integer, 'null'], minimum: 0, description: 1-based stopped round, when known. }
    CommandRecord:
      description: Durable command-ledger row (ADR-0091).
      type: object
      required: [name, args, status, timestamp]
      properties:
        name: { type: string, description: Command word, or "shell" for a `!command` passthrough. }
        args: { type: string }
        status: { enum: [Success, Error] }
        result: { type: [object, 'null'], additionalProperties: true }
        timestamp: { type: integer, minimum: 0, description: Unix-epoch milliseconds at invocation. }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
    ToolStream:
      oneOf:
        - type: object
          required: [Stdout]
          properties: { Stdout: { type: string } }
          additionalProperties: false
        - type: object
          required: [Stderr]
          properties: { Stderr: { type: string } }
          additionalProperties: false
    ToolOutput:
      description: |
        Structured tool result, represented as an externally tagged enum. Its
        variants evolve with tools; frontends may render known variants and
        fall back to the sibling `output` text for unknown variants.
      oneOf:
        - type: object
          required: [Text]
          properties: { Text: { type: string } }
          additionalProperties: false
        - type: object
          required: [Error]
          properties:
            Error:
              type: object
              required: [message, detail]
              properties: { message: { type: string }, detail: { type: [string, 'null'] } }
              additionalProperties: false
          additionalProperties: false
        - type: object
          minProperties: 1
          maxProperties: 1
          additionalProperties: true
    TodoList:
      type: object
      required: [items, next_id, updated_at_round]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, content, status, created_at, updated_at]
            properties:
              id: { type: integer, minimum: 0 }
              content: { type: string }
              status: { enum: [pending, in_progress, completed, cancelled] }
              created_at: { type: integer, minimum: 0 }
              updated_at: { type: integer, minimum: 0 }
            additionalProperties: false
        next_id: { type: integer, minimum: 1 }
        updated_at_round: { type: integer, minimum: 0 }
      additionalProperties: false
    ChannelAuth: { enum: [ApiKey, XaiOAuth, ChatGptOAuth, CopilotOAuth, AntigravityOAuth] }
    LoginMethod: { enum: [device, browser] }
    ConnectStatus:
      oneOf:
        - type: object
          required: [state, provider, url, user_code, message]
          properties:
            state: { const: pending }
            provider: { type: string }
            url: { type: string, format: uri }
            user_code: { type: string }
            message: { type: string }
          additionalProperties: false
        - type: object
          required: [state, provider]
          properties: { state: { const: done }, provider: { type: string } }
          additionalProperties: false
        - type: object
          required: [state, provider, message]
          properties: { state: { const: failed }, provider: { type: string }, message: { type: string } }
          additionalProperties: false
    ProviderPickerSnapshot:
      type: object
      required: [default_id, rows]
      properties:
        default_id: { type: string }
        rows: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    SessionContextSnapshot:
      type: object
      required: [model, tools, permissions, skills, mcp]
      properties:
        model: { type: object, additionalProperties: true }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        permissions: { type: array, items: { type: object, additionalProperties: true } }
        skills: { type: array, items: { type: object, additionalProperties: true } }
        mcp: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
